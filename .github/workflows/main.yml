name: CI PawCloud

# Se ejecuta en cada push a main y en cada pull request.
# Netlify, conectado al repo, genera además la vista previa (staging) de cada pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar-y-probar:
    name: Validar HTML y correr pruebas de flujo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install
      - name: Validar HTML
        run: npm run lint
      - name: Pruebas de flujo
        run: npm test

  lighthouse:
    name: Rendimiento y accesibilidad (Lighthouse)
    runs-on: ubuntu-latest
    needs: validar-y-probar
    steps:
      - uses: actions/checkout@v4
      - name: Preparar carpeta a publicar
        run: |
          mkdir dist
          cp index.html dist/
      - name: Ejecutar Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
